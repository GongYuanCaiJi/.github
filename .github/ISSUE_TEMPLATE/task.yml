# Adopted from:
# - https://github.com/langchain-ai/langchain/blob/master/.github/ISSUE_TEMPLATE/task.yml
# Necessary substitutions: repo name, operator wording, affected surface list, Traditional Chinese labels.
name: Task / Maintainer Work
description: 建立 maintainer / operator 用的任務、支線、收尾或追蹤工作。
title: "[Task]: "
labels: ["task", "needs-triage"]
type: task
body:
  - type: markdown
    attributes:
      value: |
        這張表單直接採用 LangChain maintainer task 的工作方式：
        用 GitHub issue 追蹤內部任務、規劃、重構、文件整理、收尾和依賴。

  - type: checkboxes
    id: maintainer
    attributes:
      label: Maintainer / operator task
      description: 確認這不是一般 bug 或 feature request。
      options:
        - label: 這是 maintainer / operator 工作，或是 owner 明確要求追蹤的任務。
          required: true

  - type: dropdown
    id: task_shape
    attributes:
      label: 任務形狀
      description: 這件事跟目前工作線的關係是什麼？
      options:
        - Mainline task
        - Side-line task from a mainline
        - Blocking prerequisite
        - Follow-up / cleanup
        - Research / decision before implementation
        - Other / not sure
    validations:
      required: true

  - type: textarea
    id: task_description
    attributes:
      label: 任務描述
      description: 具體要做什麼？範圍是什麼？
      placeholder: |
        這件任務要...
        範圍包含...
        不應該延伸到...
    validations:
      required: true

  - type: textarea
    id: acceptance_criteria
    attributes:
      label: 完成標準
      description: 滿足哪些結果，這個任務才算完成？
      placeholder: |
        這個任務完成時：
        - [ ] ...
        - [ ] ...
        - [ ] ...
    validations:
      required: true

  - type: textarea
    id: context
    attributes:
      label: 背景與原因
      description: 為什麼需要這件任務？它從哪個主線或問題長出來？
      placeholder: |
        背景：
        - ...

        相關 issue / PR：
        - #...
    validations:
      required: false

  - type: textarea
    id: task_preferences
    attributes:
      label: 特殊偏好
      description: 只對這一張任務有效的 owner 偏好；不要填長期規則，長期規則應該進正式規則面。
      placeholder: |
        這次任務希望 AI 這樣做：
        - ...

        這次任務不要這樣做：
        - ...
    validations:
      required: false

  - type: textarea
    id: task_exceptions
    attributes:
      label: 例外處理
      description: 只對這一張任務有效的例外、暫停、繞開或延期事項；不要填永久 gate。
      placeholder: |
        本任務的例外：
        - ...

        解除條件：
        - ...
    validations:
      required: false

  - type: textarea
    id: dependencies
    attributes:
      label: 依賴 / 阻塞
      description: 有哪些 issue、PR、外部工具或決策要先完成？
      placeholder: |
        Depends on:
        - #...

        Blocked by:
        - ...
    validations:
      required: false

  - type: dropdown
    id: execution_mode
    attributes:
      label: 預期執行方式
      description: 這不是自動執行，只是先標清楚預期路徑。
      options:
        - GitHub issue / PR only
        - Spec Kit likely needed
        - AO supervised run requested
        - Research before deciding
        - Other / not sure
    validations:
      required: true

  - type: checkboxes
    id: decision_surface
    attributes:
      label: Owner 決策需要看到什麼？
      description: 如果這個任務最後要進 PR 或 closeout，哪些資訊必須講清楚？
      options:
        - label: 目的與因果鏈要用人話寫清楚。
          required: false
        - label: 如果改 code，要揭露哪些是主流方案，哪些是 glue / 自製程式。
          required: false
        - label: 如果有人類可驗收行為，要寫 UAT / 驗收方式。
          required: false
        - label: 如果影響交接或連續性，要寫 handoff / continuity impact。
          required: false

  - type: dropdown
    id: affected_surface
    attributes:
      label: 影響範圍
      multiple: true
      options:
        - GitHub Issues / Projects / PR workflow
        - Spec Kit workflow
        - Handoff / continuity
        - Hooks / validators
        - Cross-agent review / dispatch
        - Worktree / branch / git workflow
        - Documentation / operator guidance
        - Other / not sure
    validations:
      required: true
