# Adopted from:
# - https://github.com/langchain-ai/langchain/blob/master/.github/ISSUE_TEMPLATE/feature-request.yml
# - https://github.com/openai/openai-python/blob/main/.github/ISSUE_TEMPLATE/feature_request.yml
# Necessary substitutions: repo name, support routing, Traditional Chinese labels.
name: Feature Request
description: 提出 Global Governance repo / workflow / automation 的新功能或改善。
title: "[Feature]: "
labels: ["enhancement", "needs-triage"]
type: feature
body:
  - type: markdown
    attributes:
      value: |
        請只用這張表單提出「新能力」或「既有能力改善」。
        如果是 bug，請改用 Bug Report；如果是 maintainer/operator 內部工作，請用 Task。

  - type: checkboxes
    id: checks
    attributes:
      label: 提交前確認
      description: 這些確認項直接採用 LangChain / OpenAI Python 類 feature request template 的 triage 思路。
      options:
        - label: 這是 feature request，不是 bug、一般問題或純研究題。
          required: true
        - label: 我已經搜尋過既有 issue，沒有找到同一個需求。
          required: true
        - label: 我已經確認這不是現有功能已經能做到的事情。
          required: true
        - label: 我已經寫清楚標題，讓人能一眼看懂需求。
          required: true

  - type: textarea
    id: feature_description
    attributes:
      label: 功能描述
      description: 你希望新增或改善什麼？
      placeholder: "我希望 Global Governance 可以..."
    validations:
      required: true

  - type: textarea
    id: use_case
    attributes:
      label: 使用情境 / 要解決的問題
      description: 這個功能解決什麼實際問題？現在卡在哪裡？
      placeholder: |
        我目前遇到的問題是...
        這會影響...
        如果有這個功能，就可以...
    validations:
      required: true

  - type: textarea
    id: proposed_solution
    attributes:
      label: 可能解法
      description: 如果你已經有想法，可以寫在這裡；沒有也可以留空。
      placeholder: "可能可以透過..."
    validations:
      required: false

  - type: textarea
    id: alternatives
    attributes:
      label: 已考慮的替代方案
      description: 有沒有看過其他工具、主流方案、workaround？它們為什麼不夠？
      placeholder: |
        我看過...
        但它不適合，因為...
    validations:
      required: false

  - type: textarea
    id: additional_context
    attributes:
      label: 補充資訊
      description: 相關 issue、PR、來源、截圖或背景。
    validations:
      required: false
