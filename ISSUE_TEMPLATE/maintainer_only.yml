# Adopted from:
# - https://github.com/microsoft/autogen/blob/main/.github/ISSUE_TEMPLATE/3-maintainer_only.yml
# - https://github.com/langchain-ai/langchain/blob/master/.github/ISSUE_TEMPLATE/privileged.yml
# Necessary substitutions: repo name, owner/operator wording, Traditional Chinese labels.
name: Maintainer Only / Privileged
description: 只有 owner / maintainer / operator 明確需要時使用。
title: "[Maintainer]: "
labels: ["maintainer-only", "needs-triage"]
body:
  - type: markdown
    attributes:
      value: |
        這張表單只用於 owner / maintainer / operator 內部事項。
        一般 bug、feature、task、docs issue 請使用其他表單。

  - type: checkboxes
    id: confirmation
    attributes:
      label: 使用確認
      description: 這個確認直接採用 AutoGen maintainer-only template 的做法。
      options:
        - label: 我確認這是 owner / maintainer / operator 才應建立的內部 issue。
          required: true

  - type: textarea
    id: body
    attributes:
      label: Issue body
      description: 請完整描述內部事項、限制、相關 issue / PR、以及需要追蹤的結果。
    validations:
      required: true
